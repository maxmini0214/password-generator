<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator — Free Secure Random Password Tool</title>
<meta name="description" content="Generate strong, secure random passwords instantly. Customize length, character types, and generate multiple passwords at once. 100% client-side using crypto.getRandomValues.">
<meta name="keywords" content="password generator, random password, secure password, strong password, free tool">
<meta property="og:title" content="Password Generator — Free Secure Random Password Tool">
<meta property="og:description" content="Generate strong random passwords instantly. 100% client-side, no data sent to servers.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://maxmini0214.github.io/password-generator/">
<link rel="canonical" href="https://maxmini0214.github.io/password-generator/">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 8px;text-align:center}
h1 span{color:#7c3aed}
.subtitle{color:#888;margin-bottom:24px;text-align:center;font-size:.95rem}
.card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:16px;padding:28px;width:100%;max-width:560px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:#aaa;margin-bottom:6px;font-weight:500}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.slider-row input[type=range]{flex:1;accent-color:#7c3aed;height:6px}
.slider-row .val{background:#7c3aed;color:#fff;border-radius:8px;padding:4px 12px;font-weight:700;min-width:44px;text-align:center;font-size:.9rem}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:8px;background:#12122a;border:1px solid #2a2a4a;border-radius:10px;padding:10px 14px;cursor:pointer;transition:.2s}
.opt:hover{border-color:#7c3aed}
.opt input{accent-color:#7c3aed;width:18px;height:18px}
.opt span{font-size:.9rem}
.count-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.count-row select{background:#12122a;color:#e0e0e0;border:1px solid #2a2a4a;border-radius:8px;padding:8px 12px;font-size:.9rem}
.btn{background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:.2s}
.btn:hover{background:#6d28d9}
.btn:active{transform:scale(.98)}
.results{margin-top:16px}
.pw-row{display:flex;align-items:center;gap:8px;background:#12122a;border:1px solid #2a2a4a;border-radius:10px;padding:12px;margin-bottom:8px;word-break:break-all}
.pw-row .pw{flex:1;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.95rem;letter-spacing:.5px}
.pw-row .copy-btn{background:#2a2a4a;color:#ccc;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.8rem;white-space:nowrap;transition:.2s}
.pw-row .copy-btn:hover{background:#7c3aed;color:#fff}
.pw-row .copy-btn.copied{background:#10b981;color:#fff}
.strength-bar{height:6px;border-radius:3px;background:#2a2a4a;margin-top:4px;overflow:hidden}
.strength-bar .fill{height:100%;border-radius:3px;transition:width .3s,background .3s}
.strength-label{font-size:.8rem;margin-top:4px;font-weight:600}
.s-weak{color:#ef4444}.s-medium{color:#f59e0b}.s-strong{color:#3b82f6}.s-vstrong{color:#10b981}
footer{margin-top:auto;padding:20px;color:#555;font-size:.8rem;text-align:center}
footer a{color:#7c3aed;text-decoration:none}
@media(max-width:480px){h1{font-size:1.4rem}.options{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<h1>🔐 <span>Password</span> Generator</h1>
<p class="subtitle">Secure random passwords — 100% client-side, nothing leaves your browser</p>

<div class="card">
  <label>Password Length: <strong id="lenVal">16</strong></label>
  <div class="slider-row">
    <span class="val">8</span>
    <input type="range" id="lenSlider" min="8" max="128" value="16">
    <span class="val">128</span>
  </div>

  <label>Character Types</label>
  <div class="options">
    <label class="opt"><input type="checkbox" id="upper" checked><span>ABC Uppercase</span></label>
    <label class="opt"><input type="checkbox" id="lower" checked><span>abc Lowercase</span></label>
    <label class="opt"><input type="checkbox" id="digits" checked><span>123 Numbers</span></label>
    <label class="opt"><input type="checkbox" id="special" checked><span>!@# Symbols</span></label>
  </div>

  <div class="count-row">
    <label style="margin:0">Generate</label>
    <select id="count">
      <option value="1">1 password</option>
      <option value="3">3 passwords</option>
      <option value="5">5 passwords</option>
      <option value="10">10 passwords</option>
    </select>
  </div>

  <button class="btn" id="genBtn">Generate Password(s)</button>

  <div class="results" id="results"></div>
</div>

<footer>
  Uses <code>crypto.getRandomValues()</code> — no data leaves your browser.<br>
  <a href="https://github.com/maxmini0214/password-generator">View Source on GitHub</a>
</footer>

<script>
const $ = s => document.getElementById(s);
const slider = $('lenSlider'), lenVal = $('lenVal');
slider.addEventListener('input', () => lenVal.textContent = slider.value);

function generate() {
  const len = +slider.value;
  const sets = [];
  if ($('upper').checked) sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
  if ($('lower').checked) sets.push('abcdefghijklmnopqrstuvwxyz');
  if ($('digits').checked) sets.push('0123456789');
  if ($('special').checked) sets.push('!@#$%^&*()_+-=[]{}|;:,.<>?');
  if (!sets.length) { alert('Select at least one character type'); return; }
  const pool = sets.join('');
  const count = +$('count').value;
  const res = $('results');
  res.innerHTML = '';

  for (let i = 0; i < count; i++) {
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    let pw = '';
    for (let j = 0; j < len; j++) pw += pool[arr[j] % pool.length];

    const strength = calcStrength(pw, pool.length, len);
    const row = document.createElement('div');
    row.innerHTML = `
      <div class="pw-row">
        <span class="pw">${esc(pw)}</span>
        <button class="copy-btn" onclick="copyPw(this,'${esc(pw)}')">Copy</button>
      </div>
      <div class="strength-bar"><div class="fill" style="width:${strength.pct}%;background:${strength.color}"></div></div>
      <div class="strength-label ${strength.cls}">${strength.label}</div>`;
    res.appendChild(row);
  }
}

function calcStrength(pw, poolSize, len) {
  const bits = Math.log2(poolSize) * len;
  if (bits < 40) return {pct:25,color:'#ef4444',label:'Weak',cls:'s-weak'};
  if (bits < 60) return {pct:50,color:'#f59e0b',label:'Medium',cls:'s-medium'};
  if (bits < 80) return {pct:75,color:'#3b82f6',label:'Strong',cls:'s-strong'};
  return {pct:100,color:'#10b981',label:'Very Strong',cls:'s-vstrong'};
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function copyPw(btn, text) {
  // decode HTML entities
  const t = document.createElement('textarea');
  t.innerHTML = text;
  navigator.clipboard.writeText(t.value).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

$('genBtn').addEventListener('click', generate);
generate();
</script>
</body>
</html>
